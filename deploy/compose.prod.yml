# DevLeaderboard production stack (own compose project and networks, next to the
# other apps on the host).
#
#   cd /opt/leaderboard
#   docker compose -f compose.prod.yml --env-file .env up -d --wait
#
# Only 127.0.0.1:13100 (frontend) is published; the host Caddy terminates TLS
# (see leaderboard.caddy). MongoDB has no published port and sits on an
# internal network. CI pushes :latest on every push to main; Watchtower (label
# below) pulls it and recreates the containers.

name: leaderboard

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    networks: [data]
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 200
    logging: *logging
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: ghcr.io/wailbentafat/devleaderboard-backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=200
      DATABASE_HOST: mongo
      DATABASE_PORT: "27017"
      DATABASE_NAME: devleaderboard
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN in .env}
      LEADERBOARD_ORGS: ${LEADERBOARD_ORGS:-MicroClub-USTHB}
      LEADERBOARD_CRON: ${LEADERBOARD_CRON:-0 */6 * * *}
      MCID_URL: ${MCID_URL:-}
      MCID_API_KEY: ${MCID_API_KEY:-}
      MCID_DEV_ROLE_IDS: ${MCID_DEV_ROLE_IDS:-}
      MCID_ROSTER_TTL_MS: ${MCID_ROSTER_TTL_MS:-600000}
    depends_on:
      mongo:
        condition: service_healthy
    # data: reach mongo; edge: reach the frontend and the internet (GitHub, MCID)
    networks: [data, edge]
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    mem_limit: 320m
    cpus: 1.0
    pids_limit: 200
    logging: *logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/wailbentafat/devleaderboard-frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:13100:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 50
    logging: *logging

networks:
  data:
    internal: true
  edge: {}

volumes:
  mongo-data: {}
