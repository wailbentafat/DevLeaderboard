# Usage: GITHUB_TOKEN=ghp_xxx docker compose up --build
# Frontend: http://localhost:8080   Backend API: http://localhost:3000
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_HOST: mongo
      DATABASE_PORT: 27017
      DATABASE_NAME: devleaderboard
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN (needed to boot)}
      # "Link your GitHub" page: leave MCID_PROJECT_ID empty to turn it off.
      MCID_URL: ${MCID_URL:-https://mcid.microclub.info/api}
      MCID_PROJECT_ID: ${MCID_PROJECT_ID:-}
      MCID_API_KEY: ${MCID_API_KEY:-}
      MCID_SERVER_ID: ${MCID_SERVER_ID:-}
      MCID_LINK_WEBHOOK_ID: ${MCID_LINK_WEBHOOK_ID:-}
      MCID_LINK_WEBHOOK_SECRET: ${MCID_LINK_WEBHOOK_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      LINK_SESSION_SECRET: ${LINK_SESSION_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
